[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  DATABASE_URL = "file:./dev.db"
  JWT_SECRET = "medireach_jwt_super_secret_session_key_2026_secure"
  NEXT_PUBLIC_APP_URL = "https://medireach.netlify.app"

[functions]
  included_files = ["dev.db", "prisma/dev.db", "prisma/**"]

